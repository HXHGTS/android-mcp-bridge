name: Android Build and Manual Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '留空只构建；填写例如 v0.3.0 才创建 GitHub Release'
        required: false
        type: string
      prerelease:
        description: '将该手动发布标记为预发布版本'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            gradle --no-daemon :app:assembleDebug -PappVersionName="${RELEASE_TAG#v}"
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-mcp-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  manual-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-mcp-bridge-debug-apk
          path: release-assets
      - name: Generate checksum
        working-directory: release-assets
        run: sha256sum app-debug.apk > SHA256SUMS
      - name: Create manual GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/app-debug.apk release-assets/SHA256SUMS \
            --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
