name: Android Build and Manual Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '留空只构建；填写例如 v0.3.0 才创建 GitHub Release'
        required: false
        type: string
      prerelease:
        description: '将该手动发布标记为预发布版本'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare stable release keystore
        if: ${{ inputs.release_tag != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-mcp-release.jks"
          chmod 600 "$RUNNER_TEMP/android-mcp-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/android-mcp-release.jks" >> "$GITHUB_ENV"
      - name: Build debug APK (push or manual build without tag)
        if: ${{ inputs.release_tag == '' }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Build signed release APK (manual tagged run only)
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: android-mcp-release
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "release_tag must be vMAJOR.MINOR.PATCH (for example v0.3.0)" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          code=$((major * 1000000 + minor * 1000 + patch))
          gradle --no-daemon :app:assembleRelease \
            -PappVersionName="$version" -PappVersionCode="$code"
      - name: Verify debug APK
        if: ${{ inputs.release_tag == '' }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signed release APK
        if: ${{ inputs.release_tag != '' }}
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload debug build artifact
        if: ${{ inputs.release_tag == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-mcp-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed release artifact
        if: ${{ inputs.release_tag != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-mcp-bridge-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  manual-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-mcp-bridge-release-apk
          path: release-assets
      - name: Generate checksum
        working-directory: release-assets
        run: sha256sum app-release.apk > SHA256SUMS
      - name: Create manual GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/app-release.apk release-assets/SHA256SUMS \
            --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
